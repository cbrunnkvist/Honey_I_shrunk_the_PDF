[project]
name = "pdf-image-compressor"
version = "0.1.0"
description = "Compress PDF files by resizing embedded images"
requires-python = ">=3.9"
dependencies = [
    "PyMuPDF>=1.23.0",
    "Pillow>=10.0.0",
]

[project.scripts]
pdf-image-compressor = "pdf_image_compressor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
